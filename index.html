<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketIQ — ניהול פניות לקוחות</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --primary: #1a3a8f;
    --primary-light: #e3f2fd;
    --bg: #f8f9fa;
    --text: #1c2333;
    --text-light: #6b7488;
    --border: #e2e6ee;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --high: #fee2e2;
    --medium: #fed7aa;
    --low: #dcfce7;
    --card-bg: #ffffff;
  }

  html[data-theme="dark"] {
    --primary: #3b82f6;
    --primary-light: #1e3a8a;
    --bg: #0f172a;
    --text: #f1f5f9;
    --text-light: #cbd5e1;
    --border: #334155;
    --high: #7f1d1d;
    --medium: #7c2d12;
    --low: #065f46;
    --card-bg: #1e293b;
  }

  body {
    margin: 0;
    padding: 28px;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 16px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 32px;
    color: var(--primary);
  }

  .sub {
    color: var(--text-light);
    margin-bottom: 0;
  }

  .theme-toggle {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: background 0.3s;
  }

  .theme-toggle:hover {
    opacity: 0.9;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 4px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .form-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }

  input, select, button, textarea {
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    color: var(--text);
    transition: border-color 0.3s, background 0.3s;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
  }

  input::placeholder, textarea::placeholder {
    color: var(--text-light);
  }

  input {
    flex: 1 1 200px;
  }

  form button {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    cursor: pointer;
    font-weight: 600;
    padding: 12px 24px;
    min-width: 140px;
  }

  form button:hover {
    background: #0d47a1;
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
  }

  .filter-controls, .action-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-controls button, .action-controls button {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
    padding: 10px 14px;
    font-size: 13px;
    flex: 0 1 auto;
  }

  .filter-controls button.active, .action-controls button.active {
    background: var(--primary);
    color: white;
  }

  .filter-controls button:hover, .action-controls button:hover {
    background: var(--primary);
    color: white;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: right;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 700;
    background: var(--primary-light);
    cursor: pointer;
    user-select: none;
  }

  th:hover {
    background: var(--primary);
    color: white;
  }

  tr.גבוהה td { background: var(--high); }
  tr.בינונית td { background: var(--medium); }
  tr.נמוכה td { background: var(--low); }

  td button {
    padding: 8px 14px;
    font-size: 13px;
    background: var(--success);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
    margin-left: 4px;
  }

  td button:hover {
    background: #059669;
  }

  .closed {
    color: var(--text-light);
    font-size: 13px;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
  }

  .status-פתוח { background: #dcfce7; color: #166534; }
  .status-בטיפול { background: #fef3c7; color: #92400e; }
  .status-ממתין { background: #fed7aa; color: #7c2d12; }
  .status-סגור { background: #f1f5f9; color: #475569; }

  .time-metric {
    font-size: 12px;
    color: var(--text-light);
  }

  .msg {
    color: var(--danger);
    margin-bottom: 12px;
    padding: 12px;
    border-radius: 6px;
    display: none;
  }

  .msg.success {
    color: var(--success);
    background: var(--low);
  }

  .msg.error {
    background: var(--high);
  }

  .msg.warning {
    color: #92400e;
    background: #fef3c7;
  }

  .empty-state {
    text-align: center;
    color: var(--text-light);
    padding: 40px 20px;
  }

  .category-tag {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    margin: 2px;
  }

  @media (max-width: 768px) {
    .header {
      flex-direction: column;
      align-items: flex-start;
    }

    .form-group {
      grid-template-columns: 1fr;
    }

    form {
      flex-direction: column;
    }

    form input, form select, form button, form textarea {
      width: 100%;
    }

    .controls {
      flex-direction: column;
    }

    .filter-controls, .action-controls {
      width: 100%;
    }

    .stats-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    th, td {
      padding: 10px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎫 TicketIQ</h1>
    <div class="sub">מערכת לניהול פניות לקוחות מתקדמת</div>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">🌙 ערכת נושא</button>
</div>

<div class="stats-grid" id="stats"></div>

<div class="card">
  <h3 style="margin-top:0;">הוסף פנייה חדשה</h3>
  <form id="add">
    <div style="flex:1;">
      <input name="customer_name" placeholder="שם הלקוח" required>
    </div>
    <div style="flex:1;">
      <input name="phone" placeholder="טלפון" type="tel">
    </div>
    <div style="flex:1;">
      <input name="subject" placeholder="נושא הפנייה" required>
    </div>
    <div style="flex:0 1 auto;">
      <select name="priority">
        <option>גבוהה</option><option selected>בינונית</option><option>נמוכה</option>
      </select>
    </div>
    <div style="flex:0 1 auto;">
      <select name="category">
        <option value="">בחר קטגוריה</option>
        <option>טכני</option><option>חיוב</option><option>משלוח</option><option>מוצר</option><option>אחר</option>
      </select>
    </div>
    <button type="submit" style="flex:0 1 auto;">➕ הוסף</button>
  </form>
</div>

<div class="card">
  <div id="msg" class="msg"></div>

  <div class="controls">
    <input type="text" id="search" class="search-box" placeholder="🔍 חפש לפי שם, נושא, טלפון או קטגוריה...">
    <div class="filter-controls">
      <button onclick="filterStatus('all')" class="active">📊 הכל</button>
      <button onclick="filterStatus('פתוח')">🟢 פתוח</button>
      <button onclick="filterStatus('בטיפול')">🟡 בטיפול</button>
      <button onclick="filterStatus('ממתין')">🟠 ממתין</button>
      <button onclick="filterStatus('סגור')">⚫ סגור</button>
    </div>
    <div class="action-controls">
      <button onclick="exportCSV()">📥 ייצוא CSV</button>
      <button onclick="sortTable('created_at')">📅 תאריך</button>
      <button onclick="sortTable('priority')">⬆️ עדיפות</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>לקוח</th>
        <th>טלפון</th>
        <th>נושא</th>
        <th>קטגוריה</th>
        <th>עדיפות</th>
        <th>סטטוס</th>
        <th>זמן</th>
        <th>פעולות</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient(
  'https://skhuhvxqmawbjvifvxnz.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraHVodnhxbWF3Ymp2aWZ2eG56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0Nzc5OTAsImV4cCI6MjEwMTA1Mzk5MH0.Yq4uUfx6AmpkLhu7trFUVnhYYdANBLL-kyx85CST1AM'
);

const rows = document.getElementById('rows');
const msg = document.getElementById('msg');
const searchBox = document.getElementById('search');
const statsDiv = document.getElementById('stats');
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

let allTickets = [];
let currentSort = 'created_at';
let currentStatusFilter = 'all';

function showMessage(text, type = 'error') {
  msg.textContent = text;
  msg.className = type;
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 4000);
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
}

function getTimeElapsed(date) {
  const now = new Date();
  const then = new Date(date);
  const diff = now - then;
  const hours = Math.floor(diff / (1000 * 60 * 60));
  const days = Math.floor(hours / 24);

  if (days > 0) return `${days} יום`;
  if (hours > 0) return `${hours} שעות`;
  return 'כעת';
}

function updateStats() {
  const open = allTickets.filter(t => t.status !== 'סגור').length;
  const closed = allTickets.filter(t => t.status === 'סגור').length;
  const high = allTickets.filter(t => t.priority === 'גבוהה' && t.status !== 'סגור').length;

  statsDiv.innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${allTickets.length}</div>
      <div class="stat-label">סה"כ פניות</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${open}</div>
      <div class="stat-label">פתוחות</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${closed}</div>
      <div class="stat-label">סגורות</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${high}</div>
      <div class="stat-label">עדיפות גבוהה</div>
    </div>
  `;
}

function filterAndDisplayTickets() {
  const query = searchBox.value.toLowerCase();
  let filtered = allTickets.filter(t => {
    const matchesSearch =
      t.customer_name.toLowerCase().includes(query) ||
      (t.phone || '').toLowerCase().includes(query) ||
      t.subject.toLowerCase().includes(query) ||
      (t.category || '').toLowerCase().includes(query);

    const matchesStatus = currentStatusFilter === 'all' || t.status === currentStatusFilter;

    return matchesSearch && matchesStatus;
  });

  rows.innerHTML = filtered.length ? filtered.map(t => `
    <tr class="${esc(t.priority)}">
      <td>${esc(t.customer_name)}</td>
      <td>${esc(t.phone || '-')}</td>
      <td>${esc(t.subject)}</td>
      <td><span class="category-tag">${esc(t.category || 'ללא')}</span></td>
      <td>${esc(t.priority)}</td>
      <td><span class="status-badge status-${t.status}">${esc(t.status)}</span></td>
      <td><span class="time-metric">${getTimeElapsed(t.created_at)}</span></td>
      <td>
        <select onchange="changeStatus(${t.id}, this.value)" style="padding:6px;font-size:12px;">
          <option value="">בחר</option>
          <option ${t.status === 'בטיפול' ? 'selected' : ''}>בטיפול</option>
          <option ${t.status === 'ממתין' ? 'selected' : ''}>ממתין</option>
          <option ${t.status === 'סגור' ? 'selected' : ''}>סגור</option>
        </select>
      </td>
    </tr>`).join('') : '<tr><td colspan="8" class="empty-state">אין פניות להצגה</td></tr>';
}

async function load() {
  const { data, error } = await db.from('tickets').select('*').order(currentSort, { ascending: currentSort === 'created_at' ? false : true });
  if (error) {
    showMessage('שגיאה בטעינה: ' + error.message, 'error');
    return;
  }
  allTickets = data || [];
  updateStats();
  filterAndDisplayTickets();
}

async function changeStatus(id, newStatus) {
  if (!newStatus) return;
  const { error } = await db.from('tickets').update({ status: newStatus }).eq('id', id);
  if (error) {
    showMessage('שגיאה בעדכון: ' + error.message, 'error');
    return;
  }
  showMessage('הסטטוס עודכן בהצלחה', 'success');
  load();
}

function filterStatus(status) {
  currentStatusFilter = status;
  document.querySelectorAll('.filter-controls button').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  filterAndDisplayTickets();
}

function sortTable(field) {
  currentSort = field;
  document.querySelectorAll('.action-controls button').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  load();
}

function exportCSV() {
  const headers = ['שם לקוח', 'טלפון', 'נושא', 'קטגוריה', 'עדיפות', 'סטטוס', 'תאריך'];
  const rows = allTickets.map(t => [
    t.customer_name,
    t.phone || '',
    t.subject,
    t.category || '',
    t.priority,
    t.status,
    new Date(t.created_at).toLocaleDateString('he-IL')
  ]);

  let csv = headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',') + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `tickets-${new Date().toLocaleDateString('he-IL')}.csv`;
  link.click();
  showMessage('הקובץ הורד בהצלחה', 'success');
}

document.getElementById('add').onsubmit = async e => {
  e.preventDefault();
  const t = Object.fromEntries(new FormData(e.target));
  const { error } = await db.from('tickets').insert({ ...t, status: 'פתוח' });
  if (error) {
    showMessage('שגיאה בהוספה: ' + error.message, 'error');
    return;
  }
  showMessage('הפנייה נוספה בהצלחה', 'success');
  e.target.reset();
  load();
};

searchBox.addEventListener('input', filterAndDisplayTickets);

initTheme();
load();
</script>
</body>
</html>
